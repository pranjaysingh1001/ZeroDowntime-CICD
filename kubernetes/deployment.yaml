apiVersion: apps/v1
kind: Deployment

metadata:
  name: zerodowntime-deployment
  namespace: production

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: zerodowntime

  template:
    metadata:
      labels:
        app: zerodowntime
        env: production
        version: v1

    spec:
      containers:
      - name: zerodowntime
        image: zerodowntime-app:v2
        imagePullPolicy: Never

        ports:
        - containerPort: 3000

        livenessProbe:
          httpGet:
            path: /health
            port: 3000

          initialDelaySeconds: 15
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 3000

          initialDelaySeconds: 5
          periodSeconds: 5

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "500m"
